[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apimart-h3-pipeline"
version = "1.0.0"
description = "Portable, resumable MiniMax-H3 sequential video editing pipeline"
requires-python = ">=3.10"
dependencies = ["Pillow>=9.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
apimart-h3-sequential = "apimart_h3_pipeline.runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apimart_h3_pipeline = ["resources/prompts/*.txt", "resources/prompts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "src"]
